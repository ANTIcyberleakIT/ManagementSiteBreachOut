# Pas dit aan op jullie Proxmox. Het geheim staat NIET in dit bestand maar in /etc/breachout.env.
proxmox_host: 10.105.30.5
proxmox_node: pve                 # naam van de node zoals getoond in Proxmox
proxmox_user: root@pam
proxmox_token_id: breachout
proxmox_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
proxmox_validate_certs: false     # zelfondertekend certificaat; zet op true met een echt certificaat

clean_snapshot: clean             # naam van de snapshot met de beginstand van elke challenge-VM

# challenge-id (zie Admin -> Challenges) -> VM-id in Proxmox

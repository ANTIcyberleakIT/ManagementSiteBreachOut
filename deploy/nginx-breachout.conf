# Installeren:  sudo cp deploy/nginx-breachout.conf /etc/nginx/sites-available/breachout
# (gebruikt de certificaten die webserver-setup.sh al heeft aangemaakt)
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/certs/webserver.crt;
    ssl_certificate_key /etc/ssl/private/webserver.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;          # nodig voor de live-verbinding
        proxy_set_header Connection "";
        proxy_read_timeout 600s;         # een reset/opruiming via Ansible mag tot 5+ minuten duren
    }
}
